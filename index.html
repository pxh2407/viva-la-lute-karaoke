<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
<title>Viva la LUTE – Karaoke</title>
<meta name="description" content="LUTE Milazzo: Viva la LUTE, karaoke con le parole che scorrono. Segui le parole e canta con noi!">
<!-- anteprima del collegamento su WhatsApp, Facebook, email -->
<meta property="og:type" content="website">
<meta property="og:locale" content="it_IT">
<meta property="og:site_name" content="LUTE Milazzo">
<meta property="og:title" content="Viva la LUTE – Karaoke">
<meta property="og:description" content="Solo musica, con le parole che scorrono: segui le parole e canta con noi!">
<meta property="og:image" content="https://pxh2407.github.io/viva-la-lute-karaoke/anteprima-v3.jpg">
<meta property="og:image:secure_url" content="https://pxh2407.github.io/viva-la-lute-karaoke/anteprima-v3.jpg">

<style>
  :root { --verde: #1b5e3f; --scuro: #0e3423; --oro: #d2ac50; --crema: #f8f4ea; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  body {
    min-height: 100vh; background: radial-gradient(circle at 50% 40%, var(--verde), var(--scuro) 75%);
    color: var(--crema); font-family: "Segoe UI", system-ui, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 70px 16px 36px;
  }
  .alto { color: var(--oro); font-weight: 600; letter-spacing: .5px; font-size: 17px; text-align: center; }
  h1 { font-family: Georgia, serif; font-weight: 400; font-style: italic; font-size: clamp(30px, 6vw, 46px); margin-top: 10px; text-align: center; }
  .data { font-family: "Palatino Linotype", Palatino, Georgia, serif; font-weight: 700; color: var(--oro);
          font-size: clamp(28px, 8vw, 66px); line-height: 1.1; text-align: center; }
  .riga { width: 180px; height: 3px; background: var(--oro); margin: 16px 0 22px; }
  video { width: 100%; max-width: 100%; max-height: 70vh; width: auto; height: auto; border-radius: 14px; background: #000;
          box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  .cornice { position: relative; width: 100%; max-width: 1200px; display: flex; justify-content: center; }
  #guarda { background: var(--oro); color: var(--scuro); font-size: 24px; padding: 16px 34px; }
  .nota { margin-top: 18px; font-size: 19px; text-align: center; max-width: 640px; line-height: 1.5; }
  .nota b { color: var(--oro); }
  .pulsanti { display: flex; gap: 14px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
  .pulsanti button {
    font: inherit; font-size: 21px; font-weight: 600; padding: 14px 28px; border-radius: 12px;
    cursor: pointer; min-width: 150px; border: 2px solid var(--oro);
  }
  #ferma { background: var(--crema); color: var(--scuro); }
  /* Esci sempre visibile in alto a destra */
  #esci { position: fixed; top: 12px; right: 12px; z-index: 10; min-width: 0; padding: 10px 18px;
          background: var(--scuro); color: var(--crema); box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  #fine { display: none; margin-top: 20px; font-size: 22px; text-align: center; line-height: 1.5; }
  #fine b { color: var(--oro); }
  /* invito a girare il telefono, solo sul cellulare tenuto in verticale */
  #gira { display: none; margin: 0 0 16px; padding: 12px 22px; border-radius: 12px; border: 2px solid var(--oro);
          background: rgba(0,0,0,.25); font-size: 21px; font-weight: 600; text-align: center; }
  #gira span { display: inline-block; font-size: 30px; vertical-align: middle; margin-right: 8px; }
  @media (orientation: portrait) and (pointer: coarse) { #gira { display: block; } }
  /* cellulare in orizzontale: solo il video, grande quanto lo schermo */
  @media (orientation: landscape) and (pointer: coarse), (orientation: landscape) and (max-height: 600px) {
    /* pagina ferma: niente scorrimento a destra/sinistra né in alto/basso */
    html, body { overflow: hidden; width: 100%; height: 100vh; height: 100dvh; overscroll-behavior: none; touch-action: none; }
    body { padding: 0; justify-content: center; background: #000; min-height: 100vh; min-height: 100dvh; }
    .alto, h1, .data, .riga, .nota, #fine, #ferma, #guarda { display: none !important; }
    .cornice { max-width: none; }
    .pulsanti { margin: 0; height: 0; }
    video { width: 100%; height: 100vh; height: 100dvh; max-width: none; max-height: none;
            border-radius: 0; box-shadow: none; object-fit: contain; }
    #esci { top: 8px; right: 8px; padding: 6px 14px; font-size: 17px; opacity: .85; }
  }
</style>
</head>
<body>
  <div class="pulsanti"><button id="esci" type="button">✕ Esci</button></div>
  <div class="alto">LUTE MILAZZO</div>
  <h1>Karaoke</h1>
  <div class="data">VIVA LA LUTE!</div>
  <div class="riga"></div>
  <div id="gira"><span>📱↻</span>Giri il telefono in orizzontale</div>
  <div class="cornice">
    <video data-v="viva-la-lute-karaoke-v3.mp4" data-o="viva-la-lute-karaoke-oriz-v1.mp4" data-pv="copertina-karaoke-v3.jpg" data-po="anteprima-v3.jpg" controls playsinline preload="auto"></video>
  </div>
  <p class="nota" id="nota">Solo musica: la voce siete <b>voi</b>! Seguite le parole e cantate.</p>
  <p id="fine">Grazie per aver cantato con noi!<br><b>Viva la LUTE, evviva la vita!</b></p>
  <div class="pulsanti">
    <button id="guarda" type="button">▶ Guarda il video</button>
    <button id="ferma" type="button">⏹ Ferma</button>
  </div>
  <p class="nota" id="aiuto" hidden>Per chiudere, tocchi la <b>✕</b> o la freccia <b>←</b> in alto a sinistra dello schermo del telefono.</p>
<script>
  const v = document.querySelector("video");
  // formato del video secondo lo schermo: orizzontale su PC e telefono girato (parole più grandi),
  // verticale sul telefono tenuto dritto. Se si gira il telefono durante l'ascolto, si riprende dallo stesso punto.
  const orizzontale = window.matchMedia("(orientation: landscape)");
  const cellulare = window.matchMedia("(pointer: coarse)").matches;
  function scegliFormato() {
    const o = orizzontale.matches || cellulare, src = o ? v.dataset.o : v.dataset.v;
    if (v.getAttribute("src") === src) return;
    const t = v.currentTime || 0, andava = !v.paused;
    v.poster = o ? v.dataset.po : v.dataset.pv; v.src = src;
    if (t > 0) v.addEventListener("loadedmetadata", () => { v.currentTime = t; if (andava) v.play().catch(() => {}); }, { once: true });
  }
  scegliFormato();
  orizzontale.addEventListener("change", scegliFormato);
  function esciSchermoIntero() {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    if (document.webkitFullscreenElement) document.webkitExitFullscreen();
    if (v.webkitDisplayingFullscreen) v.webkitExitFullscreen();
  }
  // ferma: interrompe il video e torna all'immagine iniziale
  function ferma() {
    v.pause(); esciSchermoIntero(); v.currentTime = 0; v.load();
  }
  document.getElementById("ferma").onclick = ferma;
  // un tocco su "Guarda il video" fa partire il video
  function guarda() { v.play().catch(() => {}); }
  document.getElementById("guarda").onclick = guarda;
  // prova a partire da solo all'apertura (se il telefono non lo permette, resta il ▶ dei comandi)
  window.addEventListener("load", guarda);
  // a fine video: esce da solo dallo schermo intero e mostra il saluto
  v.addEventListener("ended", () => {
    ferma();
    document.getElementById("nota").style.display = "none";
    document.getElementById("fine").style.display = "block";
  });
  v.addEventListener("play", () => { document.getElementById("fine").style.display = "none"; });
  // sul cellulare: al primo tocco di ▶ schermo intero e, dove il telefono lo permette (Android), orizzontale
  v.addEventListener("play", async () => {
    if (!cellulare || document.fullscreenElement || v.webkitDisplayingFullscreen) return;
    // Se il telefono è GIÀ in orizzontale il video riempie da solo lo schermo (vedi il CSS
    // più sopra): chiedere lo schermo intero vero non servirebbe a nulla e farebbe comparire
    // per qualche secondo l'avviso col nome del sito, che il browser mostra sempre e che
    // non si può togliere. Quindi in orizzontale lo si lascia stare.
    if (window.matchMedia("(orientation: landscape)").matches) return;
    try {
      if (v.requestFullscreen) await v.requestFullscreen();
      else if (v.webkitEnterFullscreen) { v.webkitEnterFullscreen(); return; } // iPhone: si gira col telefono
      // Android: blocca lo schermo in orizzontale finché si resta a schermo intero
      if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape");
    } catch (e) { /* il telefono non lo consente: si continua normalmente */ }
  });
  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement && screen.orientation && screen.orientation.unlock) {
      try { screen.orientation.unlock(); } catch (e) {}
    }
  });
  // esci: prova a chiudere la pagina; se il telefono non lo permette, spiega come fare
  document.getElementById("esci").onclick = () => {
    ferma();
    window.close();
    setTimeout(() => {
      if (history.length > 1) history.back();
      document.getElementById("aiuto").hidden = false;
    }, 300);
  };
</script>
</body>
</html>
